name: Build and deploy to GitHub Pages

# GitHub Pages has no PHP runtime — it can auto-build a Jekyll site, but not
# a Jigsaw one. This workflow does the build here in Actions instead, then
# hands the resulting static files to Pages.

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Sunday night and Monday morning (Eastern): pick up that Sunday's live stream.
  schedule:
    - cron: "30 3 * * 1"
    - cron: "0 14 * * 1"

permissions:
  contents: write   # sync-sermons commits new sermon files
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Adds any new YouTube live streams to source/_sermons/ (scripts/sync_sermons.py).
  # If YouTube is unreachable this step fails quietly and the site still deploys.
  sync-sermons:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade yt-dlp
      - name: Look for new sermons on YouTube
        run: python3 scripts/sync_sermons.py 2>&1 | tee "$RUNNER_TEMP/sermon-sync.txt"; exit ${PIPESTATUS[0]}
      - name: Commit new sermons
        run: |
          git add source/_sermons
          if git diff --cached --quiet; then echo "No new sermons."; exit 0; fi
          git config user.name "abbey-website bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add new sermons from YouTube"
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Save the run log to the sermon-sync-log branch
        if: ${{ always() }}
        run: |
          cd "$RUNNER_TEMP" && rm -rf log && mkdir log && cd log
          git init -q && git checkout -q -b sermon-sync-log
          cp ../sermon-sync.txt . 2>/dev/null || echo "no log" > sermon-sync.txt
          git add . && git -c user.name="abbey-website bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Sermon sync log"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sermon-sync-log

  build:
    needs: sync-sermons
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master   # include sermons committed by sync-sermons

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Build site (production)
        run: vendor/bin/jigsaw build production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build_production

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
