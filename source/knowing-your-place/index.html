<style>

/* ===== Settings ===== */

};
const DIM_LETTERS = {EI:["E","I"], SN:["S","N"], TF:["T","F"], JP:["J","P"]};
/* Cycle E/I once and the other pairs twice per round of 7, for 10 rounds = 70 items */
const PERSONALITY = (() => {
  const idx = {EI:0, SN:0, TF:0, JP:0}, out = [];
  for (let r = 0; r < 10; r++) ["EI","SN","SN","TF","TF","JP","JP"].forEach(d => {
    const [q, a, b] = P_ITEMS[d][idx[d]++];
    const n = String(out.length + 1).padStart(2, "0");
    out.push({id:`P${n}_${d}`, dim:d, q, a:[a, DIM_LETTERS[d][0]], b:[b, DIM_LETTERS[d][1]]});
  });
  return out;
})();
const LENS_ITEMS = {
  perceiver:["I quickly notice when something is not right spiritually or morally.","I feel compelled to speak the truth, even when it is unpopular.","Hypocrisy and compromise grieve me deeply.","I tend to see issues in clear terms of right and wrong.","I can usually tell when someone's words don't match their heart."],
  servant:["I notice practical needs that others overlook.","I find deep joy in finishing hands-on tasks that help others.","I would rather show love by doing something than by saying something.","I find it hard to say no when someone needs help.","I'm happiest when I'm busy helping with something practical."],
  teacher:["I enjoy researching a topic until I really understand it.","I am bothered when Scripture or facts are used carelessly.","I like organizing information so others can learn it.","I want to check whether a new idea is true before I accept it.","I enjoy explaining things step by step until people understand."],
  exhorter:["I naturally see people's potential more than their present struggles.","I enjoy helping someone take practical next steps in their life.","People often come to me for encouragement or advice.","I get frustrated when teaching isn't applied to real life.","I like to cheer people on when they're discouraged."],
  giver:["I am quick to notice financial or material needs.","Giving feels like worship to me.","I like to keep my own lifestyle simple so I have more to give.","I prefer to give quietly, without recognition.","I look for ways to put my resources where they'll do the most good."],
  leader:["I naturally see the gap between where things are and where they could be.","I enjoy organizing people and resources toward a goal.","When no one is leading, I tend to step in.","I feel responsible for the people and projects in my care.","I enjoy setting goals and helping a group reach them."],
  merciful:["I can usually sense who is hurting in a room.","I'm drawn to people who are overlooked or suffering.","People tell me they feel safe opening up to me.","I would rather sit with someone in pain than try to fix it.","I'm quick to comfort someone who is grieving."]
};
const LOC_ITEMS = {
  apostle:["I'm energized by starting new things: ministries, groups, or churches.","I'm drawn to people and places the church hasn't reached yet.","I get restless when things stay the same for too long.","I like laying foundations that others will build on.","I think about how a ministry could multiply beyond one place.","I'm comfortable taking risks to start something new for God.","I enjoy connecting churches and leaders who could work together.","I'd rather pioneer something than maintain it.","I can picture what a new work could look like before it exists."],
  prophet:["I often sense what God may be saying to our church.","I'm drawn to prayer and listening for God's direction.","I notice when our community is drifting from God's purposes.","I feel called to help the church hear and respond to God.","I sometimes carry a strong burden from prayer that I need to share.","I'm uneasy when the church gets comfortable instead of faithful.","I can often see what is really going on beneath the surface of a situation.","I'm willing to say hard things when the church needs to hear them.","Worship and prayer are where I most often sense God's direction."],
  evangelist:["Conversations about faith come naturally to me with people outside the church.","I can explain the gospel in simple, everyday language.","I want the good news to get outside the church's walls.","I enjoy being around people who don't yet know Jesus.","I naturally look for ways to invite people to church or to faith.","I enjoy telling the story of how Jesus changed my life.","I'm comfortable talking about faith with people I've just met.","I think often about friends and neighbors who don't know God.","I get excited when someone new comes to faith."],
  shepherd:["I notice when someone is missing or struggling.","I build deep, long-term relationships within the church.","I want our church to be a safe place where people are cared for.","I'm willing to walk with people through hard seasons for a long time.","I enjoy checking in on people during the week.","I want to protect people from things that would harm them spiritually.","People share their struggles with me because they trust me.","I'd rather care well for a small group than reach a crowd.","I feel responsible for the spiritual well-being of the people around me."],
  teacher:["I want to help people understand and grow in sound teaching.","I enjoy preparing lessons or studies.","I care about passing the faith on to the next generation.","People seek me out when they have questions about the Bible.","I'm careful that what I share about the Bible is accurate.","I enjoy helping people connect Scripture to everyday life.","I like reading theology or Bible commentaries.","I can break down difficult ideas so others understand them.","I want people well grounded so they aren't misled by false teaching."]
};
const SCALE = ["Not like me","A little like me","Somewhat like me","Mostly like me","Very much like me"];
const LENS_N = 5, LOC_N = 9, LENS_MAX = LENS_N * 5, LOC_MAX = LOC_N * 5;
const LENS_TENTATIVE = 15, LOC_TENTATIVE = 27;

/* Interleave so one category never runs in a row */
function interleave(obj, prefix){
  const keys = Object.keys(obj), out = [], n = obj[keys[0]].length;
  for (let i = 0; i < n; i++) keys.forEach(k => out.push({cat:k, q:obj[k][i]}));
  return out.map((it, j) => ({...it, id: prefix + String(j + 1).padStart(2, "0") + "_" + it.cat}));
}
const LENS_Q = interleave(LENS_ITEMS, "L");
const LOC_Q = interleave(LOC_ITEMS, "F");
const QUESTIONS = [
  ...PERSONALITY.map(p => ({...p, part:1, kind:"pair"})),
  ...LENS_Q.map(p => ({...p, part:2, kind:"scale"})),

  1:{title:"Personality", sub:"How God wired you", verse:"“For you formed my inward parts; you knitted me together in my mother’s womb. I praise you, for I am fearfully and wonderfully made.” Psalm 139:13–14",
     about:"These questions look at your natural temperament: where you draw energy, how you take in the world, how you make decisions, and how you like to order your life.",

  2:{title:"Spiritual Lens", sub:"How you see the needs around you", verse:"“Having gifts that differ according to the grace given to us, let us use them.” Romans 12:6",

  3:{title:"Spiritual Location", sub:"Where Christ is placing you to serve", verse:"“And he gave the apostles, the prophets, the evangelists, the shepherds and teachers, to equip the saints for the work of ministry, for building up the body of Christ.” Ephesians 4:11–12",
     about:"Ephesians 4 names five ways Christ equips his church. Each is a location: the frontier, the threshold, the perimeter, the center, or the foundation.",
     how:"Use the same 1 to 5 scale. Answer for who you really are, not who you think you should be.", count:"45 statements · about 7 to 9 minutes"}
};

/* ===== Result content ===== */
const TYPES = {
  ISTJ:["The Inspector","ISTJs are responsible organizers, driven to create and enforce order within systems and institutions.","Nehemiah","Guardian"],

/* ===== State ===== */
const KEY = "abbey-place-assessment-v2";
let S = load() || fresh();
function fresh(){ return {screen:"welcome", i:0, answers:{}, about:{}, startedAt:null, finishedAt:null, rid: rid(), sent:false}; }
function rid(){ return "R" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase(); }
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.rid ? s : null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(){
  save();
  if (S.screen === "welcome") return renderWelcome();
  if (S.screen === "about") return renderAbout();
  if (S.screen === "intro") return renderIntro();
  if (S.screen === "quiz") return renderQuestion();
  if (S.screen === "results") return renderResults();
}

/* Move forward one question, showing the next part's intro when a part ends. */
function advance(){
  const nxt = QUESTIONS[S.i + 1];
  if (nxt && nxt.part !== QUESTIONS[S.i].part){ S.i++; S.screen = "intro"; S.part = nxt.part; }
  else S.i++;
  render(); window.scrollTo(0,0);
}

function renderQuestion(){
  const q = QUESTIONS[S.i], total = QUESTIONS.length;
  const partStart = QUESTIONS.findIndex(x => x.part === q.part);
  const partLen = QUESTIONS.filter(x => x.part === q.part).length;
  const cur = S.answers[q.id];
  let opts;
  if (q.kind === "pair"){
    opts = `<div class="opts">${[["A",q.a],["B",q.b]].map(([k,[txt,letter]]) =>
      `<button class="opt" data-v="${letter}" aria-pressed="${cur===letter}"><span class="k">${k}</span><span>${esc(txt)}</span></button>`).join("")}</div>`;
  } else {
    opts = `<div class="opts scale">${SCALE.map((t,n) =>
      `<button class="opt" data-v="${n+1}" aria-pressed="${cur===n+1}"><span class="k">${n+1}</span><span>${t}</span></button>`).join("")}</div>`;
  }
  const lead = q.kind === "pair" ? "Choose the one that fits you better." : "How much is this like you?";
  app.innerHTML = `
  <div class="card">
    <div class="qmeta"><span>${PARTS[q.part]}</span><span>${S.i - partStart + 1} of ${partLen}</span></div>
    <div class="progress" aria-hidden="true"><i style="width:${Math.round(S.i/total*100)}%"></i></div>
    <p class="note">${lead}</p>
    <p class="qtext">${esc(q.q)}</p>
    ${opts}
    <div class="nav"><button class="btn ghost" id="prev">Back</button>${cur!==undefined && S.i < total-1 ? `<button class="btn ghost" id="next">Next</button>` : ""}</div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const v = q.kind === "pair" ? b.dataset.v : Number(b.dataset.v);
    S.answers[q.id] = v;
    if (S.i < total - 1) advance();
    else finish();
  });
  document.getElementById("prev").onclick = () => {
    if (S.i === partStart){ S.screen = "intro"; S.part = q.part; } else S.i--;
    render();
  };
  const n = document.getElementById("next"); if (n) n.onclick = advance;
}

/* ===== Scoring ===== */
function score(){
  const dims = {};
  DIMS.forEach(d => {
    const items = PERSONALITY.filter(p => p.dim === d.key);
    const a = items.filter(p => S.answers[p.id] === d.a).length, b = items.length - a;
    const tie = a === b;
    dims[d.key] = {a, b, tie, letter: a > b ? d.a : a < b ? d.b : (S.answers[items[0].id] || d.a)};
  });
  const code = DIMS.map(d => dims[d.key].letter).join("");
  const sum = (qs, cat) => qs.filter(x => x.cat === cat).reduce((t, x) => t + (S.answers[x.id] || 0), 0);
  const lens = Object.keys(LENSES).map(k => ({k, s: sum(LENS_Q, k)})).sort((x,y) => y.s - x.s);
  const loc = Object.keys(LOCS).map(k => ({k, s: sum(LOC_Q, k)})).sort((x,y) => y.s - x.s);
  return {dims, code, lens, loc};
}

function finish(){
  S.finishedAt = new Date().toISOString();
  S.screen = "results"; S.i = QUESTIONS.length - 1;
  render();
  submit();
}

function payload(r){
  const p = {
    respondent_id:S.rid, version:CONFIG.version, started_at:S.startedAt, finished_at:S.finishedAt,
    duration_sec: Math.round((new Date(S.finishedAt) - new Date(S.startedAt)) / 1000),
    first_name:S.about.first_name, last_name:S.about.last_name, email:S.about.email,
    age_range:S.about.age_range, years_at_abbey:S.about.years_at_abbey, consent:S.about.consent,
    type_code:r.code, type_name:TYPES[r.code][0], temperament:TYPES[r.code][3],
    E_count:r.dims.EI.a, I_count:r.dims.EI.b, S_count:r.dims.SN.a, N_count:r.dims.SN.b,
    T_count:r.dims.TF.a, F_count:r.dims.TF.b, J_count:r.dims.JP.a, P_count:r.dims.JP.b,
    ties: DIMS.filter(d => r.dims[d.key].tie).map(d => d.key).join(" ")
  };
  Object.keys(LENSES).forEach(k => p["lens_" + k] = r.lens.find(x => x.k === k).s);
  p.lens_primary = LENSES[r.lens[0].k].name; p.lens_secondary = LENSES[r.lens[1].k].name;
  p.lens_tie = r.lens[0].s === r.lens[1].s; p.lens_tentative = r.lens[0].s < LENS_TENTATIVE;
  Object.keys(LOCS).forEach(k => p["loc_" + k] = r.loc.find(x => x.k === k).s);
  p.loc_primary = LOCS[r.loc[0].k].name; p.loc_secondary = LOCS[r.loc[1].k].name;
  p.loc_tie = r.loc[0].s === r.loc[1].s; p.loc_tentative = r.loc[0].s < LOC_TENTATIVE;
  QUESTIONS.forEach(q => p[q.id] = S.answers[q.id] ?? "");
  return p;
}

async function submit(){
  const el = () => document.getElementById("status");
  if (S.sent) return;
  if (!CONFIG.endpoint){ if (el()) el().textContent = "Preview mode: your answers stay on this device."; return; }
  try {
    await fetch(CONFIG.endpoint, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload(score()))});
    S.sent = true; save();
    if (el()) el().textContent = "Your results were sent to The Abbey. Thank you!";
  } catch(e){
    if (el()) el().innerHTML = `We couldn't send your results just now. <button class="btn ghost" id="retry" style="padding:6px 12px;min-height:0;font-size:13px">Try again</button>`;
    const b = document.getElementById("retry"); if (b) b.onclick = submit;
  }
}

      <div class="bars">${r.loc.map((x,n) => bar(LOCS[x.k].name, x.s, LOC_MAX, n===0)).join("")}</div>
    </section>

    <div class="soft"><p><b>Only all of us, together.</b> You were not designed to be everything. You were designed to be something, and to belong to a Body that together becomes everything. Share these results with someone who knows you well and ask what they see.</p></div>
    <div class="row">
      <button class="btn" id="copy">Copy my results</button>
      <button class="btn ghost" id="again">Start over</button>
    </div>
    <p class="note" id="copied" hidden>Copied. Paste them into a note or a message.</p>
  </div>`;
  document.getElementById("copy").onclick = async () => {
    const txt = `My Place in the Body (The Abbey)\nPersonality: ${r.code}, ${t[0]}\nPrimary lens: ${L1.name} (secondary: ${L2.name})\nLocation: ${F1.name} (secondary: ${F2.name})`;
    try { await navigator.clipboard.writeText(txt); document.getElementById("copied").hidden = false; }
    catch(e){ document.getElementById("copied").hidden = false; document.getElementById("copied").textContent = txt; }
  };
  document.getElementById("again").onclick = () => { S = fresh(); render(); window.scrollTo(0,0); };
}

render();
</script>

</body>
</html>
