services:
  jigsaw:
    build: .
    ports:
      - "8000:8000"   # `jigsaw serve`
      - "5273:5273"   # vite dev server (npm run dev)
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    environment:
      # Vite rebuilds the whole site on every save and can exhaust Node's default ~2 GB heap
      # in a long session; give it more room.
      NODE_OPTIONS: --max-old-space-size=4096
    tty: true
    command: >
      sh -c "composer install --no-interaction &&
             npm install &&
             (npm run dev &) &&
             while [ ! -d build_local ]; do sleep 1; done &&
             vendor/bin/jigsaw serve --host=0.0.0.0"
